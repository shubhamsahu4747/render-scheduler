name: Render Scheduler

on:
  schedule:
    - cron: "*/2 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up Render application
        env:
          TARGET_URL: ${{ vars.TARGET_URL }}
        run: |
          if [ -z "$TARGET_URL" ]; then
            echo "Missing TARGET_URL repository variable"
            exit 1
          fi

          curl --fail --silent --show-error \
            --connect-timeout 15 \
            --max-time 90 \
            --retry 2 \
            --retry-delay 5 \
            --retry-all-errors \
            --output /dev/null \
            --write-out "HTTP status: %{http_code}\nTotal time: %{time_total}s\n" \
            "$TARGET_URL"
